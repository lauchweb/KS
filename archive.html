  <style>
    :root {
      --black: #111111;
      --light: #888888;
      --background: #ffffff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      min-height: 100vh;

      background: var(--background);
      color: var(--black);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    ::selection {
      background: var(--black);
      color: var(--background);
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding: 42px 48px 28px;
    }

    main {
      flex: 1;

      display: flex;
      justify-content: center;
    }

    .archive {
      width: 100%;
      max-width: 1180px;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 60px 0 110px;
    }

    /*
      Identity
    */

    .name {
      color: var(--black);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.005em;
    }

    /*
      INVISIBLE FICTIVE GRID

      The grid exists only as a structure.

      Desktop: 4 positions
      Tablet: 3 positions
      Mobile: 2 positions

      There are NO borders.
      There are NO boxes.
      There are NO backgrounds.

      The artworks themselves are visible.
      Each artwork keeps its natural proportions.
    */

    .archive-grid {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      column-gap: 42px;
      row-gap: 90px;

      margin-top: 120px;

      align-items: start;
    }

    /*
      Each artwork simply occupies one grid position.

      No fixed image ratio.
      No cropping.
      No stretching.
    */

    .archive-item {
      display: block;

      width: 100%;

      text-decoration: none;

      transition: opacity 180ms ease;
    }

    .archive-item:hover {
      opacity: 0.5;
    }

    .archive-image {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;
    }

    /*
      Accessibility
    */

    .archive-item:focus-visible,
    .name:focus-visible,
    .section-link:focus-visible,
    footer a:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 4px;
    }

    /*
      Navigation
    */

    .links {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 34px;

      margin-top: 150px;
    }

    .section-link {
      color: var(--black);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.005em;

      border-bottom: 1px solid var(--black);
      padding-bottom: 3px;

      transition: opacity 180ms ease;
    }

    .section-link:hover {
      opacity: 0.5;
    }

    /*
      Footer
    */

    footer {
      width: 100%;

      text-align: center;

      padding-top: 30px;

      color: var(--light);

      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    footer a {
      color: var(--light);
      text-decoration: none;

      transition: opacity 180ms ease;
    }

    footer a:hover {
      opacity: 0.5;
    }

    /*
      Tablet
    */

    @media (max-width: 900px) {

      .page {
        padding-left: 36px;
        padding-right: 36px;
      }

      .archive {
        max-width: 100%;
      }

      .archive-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));

        column-gap: 32px;
        row-gap: 70px;

        margin-top: 90px;
      }
    }

    /*
      Mobile
    */

    @media (max-width: 600px) {

      .page {
        padding: 28px 24px 22px;
      }

      .archive {
        padding: 40px 0 60px;
      }

      .name {
        font-size: 13px;
      }

      .archive-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        column-gap: 22px;
        row-gap: 58px;

        margin-top: 70px;
      }

      .links {
        gap: 22px;

        margin-top: 85px;
      }

      .section-link {
        font-size: 13px;
      }

      footer {
        padding-top: 24px;
      }
    }

    /*
      Small mobile
    */

    @media (max-width: 380px) {

      .page {
        padding-left: 20px;
        padding-right: 20px;
      }

      .archive-grid {
        column-gap: 16px;
        row-gap: 48px;

        margin-top: 60px;
      }

      .links {
        gap: 16px;
      }

      .section-link {
        font-size: 12px;
      }
    }

    /*
      Reduced motion
    */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
