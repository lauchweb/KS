<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>P</title>

  <meta
    name="description"
    content="P — an independent creative practice exploring images, objects, memory, time, and the details of everyday life."
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  >

  <meta
    name="googlebot"
    content="index, follow, max-image-preview:large"
  >

  <meta name="author" content="P">

  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">

  <link rel="canonical" href="https://www.yourwebsite.com/">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="P">
  <meta
    property="og:description"
    content="P — an independent creative practice exploring images, objects, memory, time, and the details of everyday life."
  >
  <meta property="og:url" content="https://www.yourwebsite.com/">
  <meta property="og:site_name" content="P">
  <meta property="og:image" content="https://www.yourwebsite.com/home-image.jpg">
  <meta property="og:image:alt" content="P">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="P">
  <meta
    name="twitter:description"
    content="P — an independent creative practice exploring images, objects, memory, time, and the details of everyday life."
  >
  <meta name="twitter:image" content="https://www.yourwebsite.com/home-image.jpg">
  <meta name="twitter:image:alt" content="P">

  <style>
    :root {
      --black: #111111;
      --light: #888888;
      --background: #ffffff;
      --image-background: #f4f4f4;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--black);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 42px 48px 28px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .home {
      width: 100%;
      max-width: 880px;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 60px 0;
    }

    .name {
      color: var(--black);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.005em;
    }

    .composition {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 70px;

      margin-top: 70px;
      margin-bottom: 0;
    }

    .image-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .archive-link {
      color: var(--black);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.005em;

      border-bottom: 1px solid var(--black);
      padding-bottom: 3px;

      margin-bottom: 70px;

      transition: opacity 180ms ease;
    }

    .archive-link:hover {
      opacity: 0.5;
    }

    .image {
      display: block;

      width: min(300px, 46vw);
      height: auto;

      aspect-ratio: 4 / 5;

      object-fit: cover;

      background: var(--image-background);
    }

    .practice-link {
      color: var(--black);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.005em;

      border-bottom: 1px solid var(--black);
      padding-bottom: 3px;

      margin-top: 70px;

      transition: opacity 180ms ease;
    }

    .practice-link:hover {
      opacity: 0.5;
    }

    .section-link {
      color: var(--black);
      text-decoration: none;

      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.005em;

      border-bottom: 1px solid var(--black);
      padding-bottom: 3px;

      transition: opacity 180ms ease;
    }

    .section-link:hover {
      opacity: 0.5;
    }

    .name:focus-visible,
    .section-link:focus-visible,
    .archive-link:focus-visible,
    .practice-link:focus-visible,
    footer a:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 4px;
    }

    footer {
      width: 100%;
      text-align: center;

      padding-top: 30px;

      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: 0.01em;

      color: var(--light);
    }

    footer a {
      color: var(--light);
      text-decoration: none;

      transition: opacity 180ms ease;
    }

    footer a:hover {
      opacity: 0.5;
    }

    @media (max-width: 600px) {

      .page {
        padding: 28px 24px 22px;
      }

      .home {
        padding: 40px 0;
      }

      .composition {
        gap: 40px;
        margin-top: 40px;
      }

      .image {
        width: min(230px, 56vw);
      }

      .archive-link {
        margin-bottom: 40px;
        font-size: 13px;
      }

      .practice-link {
        margin-top: 40px;
        font-size: 13px;
      }

      .section-link {
        font-size: 13px;
      }

      footer {
        padding-top: 24px;
      }
    }

    @media (max-width: 380px) {

      .page {
        padding-left: 20px;
        padding-right: 20px;
      }

      .composition {
        gap: 28px;
        margin-top: 28px;
      }

      .image {
        width: 54vw;
      }

      .archive-link {
        margin-bottom: 28px;
        font-size: 12px;
      }

      .practice-link {
        margin-top: 28px;
        font-size: 12px;
      }

      .section-link {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <main>

      <section class="home" aria-label="P">

        <a
          class="name"
          href="/"
          aria-label="P"
        >
          P
        </a>

        <nav
          class="composition"
          aria-label="Main navigation"
        >

          <a
            class="section-link"
            href="/about.html"
          >
            About
          </a>

          <div class="image-column">

            <a
              class="archive-link"
              href="/archive.html"
            >
              Archive
            </a>

            <img
              class="image"
              src="/home-image.jpg"
              alt=""
              width="300"
              height="375"
              fetchpriority="high"
              decoding="async"
            >

            <a
              class="practice-link"
              href="/practice.html"
            >
              Practice
            </a>

          </div>

          <a
            class="section-link"
            href="/process.html"
          >
            Process
          </a>

        </nav>

      </section>

    </main>

    <footer>
      <p>
        P © 2025–2026 ·
        <a href="/privacy.html">Privacy</a> ·
        <a href="/terms.html">Terms</a>
      </p>
    </footer>

  </div>

</body>
</html>
